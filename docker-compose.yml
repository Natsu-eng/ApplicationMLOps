# ═══════════════════════════════════════════════════════════════════════════
# DOCKER COMPOSE — DataLab Pro (FastAPI + React + PostgreSQL + Redis/RQ)
#
# Services :
#   db       — PostgreSQL 15
#   redis    — file de tâches d'entraînement (Lot 3)
#   backend  — FastAPI + Gunicorn (port 8000 interne)
#   worker   — même image que backend, exécute `rq worker` (Lot 3)
#   frontend — React buildé + Nginx (port 80 public)
#
# Démarrage : docker compose up -d --build
# Plusieurs workers (Lot 1.3, correctif C7 — isolation par job via fork,
# jobs de plusieurs organisations traités en parallèle) :
#   docker compose up -d --scale worker=3
# ═══════════════════════════════════════════════════════════════════════════

services:

  db:
    image: postgres:15-alpine
    container_name: datalab_db
    env_file: backend/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datalab_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: datalab_redis
    networks:
      - datalab_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: datalab-backend:latest
    container_name: datalab_backend
    expose:
      - "8000"
    env_file: backend/.env
    environment:
      # En Docker, le backend rejoint la base via le nom de service "db", pas "localhost"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    volumes:
      # Datasets + modèles entraînés — persistants entre redémarrages (Lot 2/3)
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - datalab_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: datalab-backend:latest
    # Pas de container_name fixe (Lot 1.3, correctif C7) : un nom fixe
    # empêche plusieurs répliques (deux conteneurs ne peuvent pas partager
    # le même nom). `deploy.replicas` ci-dessous fixe le défaut à 2 sans
    # action manuelle ; `docker compose up -d --scale worker=N` reste
    # disponible pour ajuster ponctuellement. Isolation par fork réelle
    # sous Linux (voir workers/run_worker.py) — plusieurs répliques servent
    # maintenant à quelque chose (avant, un seul worker traitait tous les
    # jobs de toutes les organisations un par un, un seul à la fois).
    deploy:
      replicas: 2
    command: ["python", "-m", "workers.run_worker"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      # "fork" explicite : ce conteneur tourne sous Linux, Worker classique
      # + isolation par fork (voir workers/run_worker.py). Ne JAMAIS mettre
      # "simple" ici — réservé au développement local Windows.
      RQ_WORKER_MODE: fork
    volumes:
      # Même volume que le backend : le worker écrit les artefacts de modèles,
      # l'API les sert — un seul système de fichiers partagé (Lot 9 : stockage
      # objet si on scale sur plusieurs machines).
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - datalab_network
    restart: unless-stopped
    # Le HEALTHCHECK de l'image (curl /api/health) n'a pas de sens ici : le
    # worker ne sert pas de HTTP — désactivé plutôt que faussement "unhealthy".
    healthcheck:
      disable: true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: datalab-frontend:latest
    container_name: datalab_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - datalab_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    name: datalab_postgres_data

networks:
  datalab_network:
    driver: bridge
    name: datalab_network
