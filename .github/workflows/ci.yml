name: CI

# Lot 0.4 (AUDIT_DATALAB_2026-08-16.md, C4) — aucun filet n'existait avant.
# Déclenché sur push ET pull_request : une PR doit être vérifiée avant fusion,
# pas seulement le push qui la crée.
on:
  push:
    branches: ["**"]
  pull_request:

# Un nouveau push sur la même branche annule le run précédent encore en
# cours — évite de payer deux fois le même travail (torch CPU est lourd).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # Redis réel requis : `is_rate_limited()` (api/core/rate_limit.py) est
    # fail-open (retourne "non limité" si Redis est injoignable), donc
    # tests/test_auth.py::test_login_blocked_after_too_many_failed_attempts
    # (qui attend un 429 après dépassement du seuil) échouerait silencieusement
    # sans Redis réellement accessible — vérifié en conditions réelles avant
    # d'écrire ce fichier (DECISIONS.md, D0.2), pas supposé.
    #
    # Postgres n'est PAS nécessaire : tests/conftest.py réécrit DATABASE_URL
    # vers un SQLite temporaire avant tout import de api.core.*, la suite ne
    # touche jamais une vraie base Postgres.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # lightgbm (backend/requirements.txt) dépend de libgomp au runtime,
      # comme dans backend/Dockerfile.
      - name: Installer les dépendances système
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Installer les dépendances Python
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérification des types (tsc)
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Lot 11 (Vérification finale) — gate programmatique, sans navigateur :
      # calcule le vrai contraste WCAG (formule officielle) des combinaisons
      # texte/fond réellement utilisées (accentSurfaceClass, Badge
      # warning/danger) à partir des couleurs et opacités extraites des
      # fichiers source, sur les 5 thèmes. Complète (ne remplace pas) les
      # scripts axe-core Playwright (scripts/lot*-axe.mjs), qui nécessitent
      # un serveur vivant et couvrent aussi les cas de double-lavis
      # (composants imbriqués) que ce script plus rapide ne modélise pas.
      - name: Contraste des couleurs (programmatique)
        working-directory: frontend
        run: node scripts/check-contrast.mjs

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Correctif (retour utilisateur, incident réel de déploiement) — les jobs
  # backend/frontend ci-dessus appellent respectivement TestClient(app)
  # (FastAPI en mémoire) et Vitest (composants isolés) : aucun des deux ne
  # construit les vraies images Docker ni ne passe par nginx. Une régression
  # de routage entre le frontend, nginx et le backend (ex. préfixe /api
  # manquant sur un router, proxy nginx mal configuré) était donc invisible
  # aux 525+42 tests tout en rendant l'application totalement non
  # fonctionnelle une fois déployée. Ce job rejoue un scénario utilisateur
  # réel (inscription → connexion → liste des datasets) contre la stack
  # Docker complète, port 80, exactement comme un vrai déploiement.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml lit .env (racine) pour SA PROPRE interpolation
      # (${POSTGRES_USER}/${PASSWORD}/${DB}) ET charge backend/.env dans les
      # conteneurs (env_file:) — deux mécanismes distincts, voir le
      # commentaire en tête de docker-compose.yml. Aucun des deux n'est
      # commité (secrets) ; .env.example fournit des valeurs sûres pour CI.
      - name: Préparer les .env (valeurs CI, jamais des secrets réels)
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env

      - name: Construire et démarrer la stack Docker complète
        run: docker compose up -d --build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # httpx seul (déjà une dépendance backend, requirements.txt) — jamais
      # le reste de requirements.txt (torch/shap/lightgbm...) : ce script ne
      # fait que des requêtes HTTP contre la stack déjà démarrée, inutile de
      # réinstaller tout le backend pour ça.
      - name: Installer httpx
        run: pip install httpx==0.27.2

      - name: Scénario de fumée (inscription → connexion → liste des datasets)
        working-directory: backend
        run: python -m scripts.smoke_test_docker

      - name: Logs des conteneurs (diagnostic en cas d'échec)
        if: failure()
        run: docker compose logs

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
